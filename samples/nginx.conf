# DATOS DE EJEMPLO - Banco Ficticio Atlántida S.A. (entidad inventada, no real)
# Frontal de banca online
server {
    listen 443 ssl;
    server_name banca-online.atlantida.example;
    ssl_certificate     /etc/nginx/tls/banca-online.atlantida.example.pem;
    ssl_certificate_key /etc/nginx/tls/banca-online.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA:DES-CBC3-SHA;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers on;
}
